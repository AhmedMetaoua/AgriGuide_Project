version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: agriadvisor
      POSTGRES_USER: agriadvisor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  orchestrator:
    build: ./backend/orchestrator
    env_file: .env
    ports:
      - "8000:8000"
    depends_on: [db, redis]

  agent_agriculture:
    build: ./backend/agent_agriculture
    env_file: .env
    depends_on: [db]

  agent_business:
    build: ./backend/agent_business
    env_file: .env
    depends_on: [db]

  agent_regulation:
    build: ./backend/agent_regulation
    env_file: .env
    depends_on: [db]

  agent_monitoring:
    build: ./backend/agent_monitoring
    env_file: .env
    depends_on: [db, redis]

  marketplace:
    build: ./backend/marketplace
    env_file: .env
    depends_on: [db]

  celery_beat:
    build: ./backend/agent_monitoring
    command: celery -A app beat --loglevel=info
    env_file: .env
    depends_on: [redis, db]

volumes:
  db_data:
